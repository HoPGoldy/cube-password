name: release

# cube-app 生产发布：镜像名自动取自仓库名（cube-xxx → hopgoldy/cube-xxx），
# 新建 cube-app 仓库可直接复用本文件。
#
# 曾试过双推腾讯云 CCR：GitHub runner 跨境推 CCR 极慢（15+ 分钟未完成，
# 单推 Docker Hub 仅 ~1.5 分钟），已回滚。服务器拉取走腾讯云 registry
# mirror（mirror.ccs.tencentyun.com，见服务器 /etc/docker/daemon.json）。
#
# 需要在仓库 Settings → Environments → production 配置：
#   secrets.DOCKERHUB_TOKEN        Docker Hub access token
# 可选 variables（不配则用默认值）：
#   vars.DOCKERHUB_NAMESPACE       默认 hopgoldy
#   vars.DOCKERHUB_USERNAME        默认 hopgoldy

on:
  push:
    tags:
      - "*"

jobs:
  build-publish-docker:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # 镜像名由仓库名自动推导：cube-password → hopgoldy/cube-password
      - name: Derive image name from repository
        id: images
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'hopgoldy' }}
        run: |
          echo "dockerhub=${DOCKERHUB_NAMESPACE}/${REPO_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME || 'hopgoldy' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.images.outputs.dockerhub }}
          tags: |
            type=semver,pattern={{version}}
          flavor: |
            latest=auto

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
